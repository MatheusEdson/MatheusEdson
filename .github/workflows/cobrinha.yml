# Gera a cobrinha que come o mapa de contribuicoes (Platane/snk) e publica
# os SVGs no branch `output`, que o README referencia.
name: cobrinha

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f59e0b&color_dots=#201e15,#1f4d2e,#2a7a45,#3aae5f,#4ade80
            dist/snake-light.svg?palette=github-light&color_snake=#b45309&color_dots=#ebe4d3,#b7dfc3,#7cc796,#3fae68,#16a34a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
